name: merge-sweeper

# The part of the loop that runs when nothing else does.
#
# `review` decides the normal cases: a clean verdict queues the merge, findings go back to
# the agent that wrote the code. This file handles every way that can fail to happen at all,
# because the repository is unattended for days at a time and a pull request nobody can act
# on is indistinguishable from a project that has stopped.
#
# Five things rot here, and each has a deadline:
#
#   0. A red build nobody was told about.  `review` only relays a CHANGES_REQUIRED verdict, so
#      until 2026-08-17 a failing `test` reached no one — #49 was reviewed, came back CLEAN,
#      and sat with a red build that the session which wrote it never heard about. The failing
#      output goes to that session now, immediately, once per failing commit.
#   1. No verdict.  The provider was down, the runner was lost, the reviewer crashed. Nothing
#      enabled auto-merge and nothing blocked it. After GRACE_MINUTES the pull request is
#      released on `test` alone. This is the release valve that lets `review` hold the queue
#      without being able to deadlock it — absence of a review is not a veto.
#   2. A relay nobody answered.  The findings reached Jules and no push ever came. After
#      GHOSTED_HOURS the pull request is parked rather than left waiting forever.
#   3. A conflict.  #28 sat CONFLICTING from 2026-08-15 with no checks and no owner. A
#      conflicted pull request cannot merge no matter how green the review is, and no agent
#      here rebases. After CONFLICT_HOURS it is drafted and labelled so the queue is honest.
#   4. Abandonment.  No commit for ABANDON_DAYS. Closed, with the branch left alone so the
#      work is recoverable.
#
# Deadlines are generous on purpose. Every action here is reversible — draft, label, close —
# and none of them touch main.

on:
  schedule:
    - cron: '*/20 * * * *'
  workflow_dispatch:

permissions:
  # `contents: write` is required to queue a merge — `mergePullRequest` and
  # `enablePullRequestAutoMerge` are both refused without it, with the unhelpfully generic
  # "Resource not accessible by integration". This file had `contents: read` from the moment
  # it was written, inherited from the reviewer it was split out of, so from 2026-08-17 the
  # release valve silently did nothing: #48 was correctly identified as 77 minutes past its
  # grace, tried to merge, failed, and the run still reported "swept: 2 pull request(s) acted
  # on" because the call was wrapped in `|| true`.
  #
  # This is safe here in a way it would not be in `review`: this job has no checkout and never
  # runs a line of anybody's code. That is the same reason the deleted auto-merge.yml held a
  # write token and refused to check anything out.
  contents: write
  pull-requests: write
  issues: write
  # To re-run a failed `test` once before believing it — see rule 1a.
  actions: write

concurrency:
  group: merge-sweeper
  cancel-in-progress: false

jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Sweep open pull requests
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          # Converting a pull request to draft is the one action here that GITHUB_TOKEN cannot
          # perform. It is a GitHub App token, and the `convertPullRequestToDraft` mutation is
          # not available to Apps: the first live run of this workflow logged
          # "GraphQL: Resource not accessible by integration (convertPullRequestToDraft)",
          # applied the label, posted a comment saying it had drafted #29, and left the pull
          # request open. A user token can do it, so try that first and fall back.
          AGENT_PAT: ${{ secrets.AGENT_PAT }}
          # For relaying a red build back to the session that wrote it.
          JULES_API_KEY: ${{ secrets.JULES_API_KEY }}
          # How long a pull request waits for a review verdict before it merges without one.
          # Long enough that a review in progress is never overtaken — the reviewer's own
          # timeout is 12 minutes — and short enough that a dead provider costs an hour, not
          # a weekend.
          GRACE_MINUTES: 45
          # A relayed pull request waits this long for Jules to push a fix.
          GHOSTED_HOURS: 12
          CONFLICT_HOURS: 24
          ABANDON_DAYS: 7
        run: |
          set -uo pipefail
          now=$(date -u +%s)
          acted=0
          failed=0

          # Draft a pull request, printing "yes" or "no". Whether it worked decides what the
          # comment says: a message claiming the pull request was drafted when it is still open
          # is worse than no message, because the next reader trusts it.
          #
          # The label is the real gate in either case — `review` skips a pull request labelled
          # `review:parked`, and rule 1 below never releases one — so a failure here degrades
          # the signal rather than the safety.
          draft_pr() {
            if [ -n "${AGENT_PAT:-}" ] \
               && GH_TOKEN="$AGENT_PAT" gh pr ready "$1" --repo "$GH_REPO" --undo >/dev/null 2>&1; then
              printf 'yes'
            elif gh pr ready "$1" --repo "$GH_REPO" --undo >/dev/null 2>&1; then
              printf 'yes'
            else
              printf 'no'
            fi
          }

          # The cheap fields for every open pull request.
          #
          # Deliberately WITHOUT `commits`. Asking for it here is the obvious way to get the
          # last-push time in one query, and it does not work: `gh pr list --limit 100 --json
          # commits` expands to commits × authors per pull request and GitHub rejects the whole
          # query — "requesting up to 1,000,000 possible nodes which exceeds the maximum limit
          # of 500,000". The failure mode is what makes it worth this comment: the redirect
          # still creates the file, the file is empty, the loop below runs zero times, and this
          # job reports "swept: 0" and exits green. A sweeper that silently stops sweeping is
          # precisely the class of failure this whole file exists to catch, so it must fail
          # loudly instead — hence the check.
          list_prs() {
            gh pr list --repo "$GH_REPO" --state open --limit 100 \
              --json number,isDraft,mergeable,mergeStateStatus,autoMergeRequest,labels,headRefName,headRefOid,headRepositoryOwner \
              --jq '.[] | {
                      n: .number,
                      draft: .isDraft,
                      mergeable: .mergeable,
                      state: .mergeStateStatus,
                      automerge: (.autoMergeRequest != null),
                      labels: [.labels[].name],
                      ref: .headRefName,
                      sha: .headRefOid,
                      owner: .headRepositoryOwner.login
                    } | @base64' > /tmp/prs.txt 2>/tmp/prs.err
          }

          ok=0
          for attempt in 1 2 3; do
            if list_prs; then ok=1; break; fi
            echo "listing attempt ${attempt} failed: $(tr -d '\n' < /tmp/prs.err | head -c 200)"
            [ "$attempt" -lt 3 ] && sleep 15
          done

          if [ "$ok" = "0" ]; then
            # Two different failures wearing the same coat, and they need opposite responses.
            #
            # A transient 5xx is GitHub being unwell — observed for hours on 2026-08-17, while
            # its status page reported all systems operational. Nobody can act on it, the next
            # run is twenty minutes away, and every deadline here is measured in hours, so
            # missing one sweep costs nothing. Going red for it would train everyone to ignore
            # red, which this repository has decided is worse than the occasional missed signal.
            #
            # Anything else is this file being wrong, and that persists until someone fixes it.
            # It has already happened once: the listing asked for `commits`, which exceeds
            # GitHub's GraphQL node limit, so the query always failed — and because the redirect
            # still created an empty file, the job reported "swept: 0" and exited green while
            # enforcing nothing at all.
            if grep -qE '\b(500|502|503|504)\b|No server is currently available|timeout|temporarily unavailable' /tmp/prs.err; then
              echo "::warning::Could not list pull requests after 3 attempts — GitHub returned a transient error. Nothing swept this run; the next one is in 20 minutes and no deadline here is that tight. Not failing the run, because nobody can act on a GitHub outage."
              exit 0
            fi
            echo "::error::Could not list open pull requests, and the error does not look transient."
            echo "::error::Nothing was swept, so no deadline in this file is being enforced — not the"
            echo "::error::45-minute release, not the 12-hour park, not the conflict or abandon rules."
            echo "::error::stderr was: $(tr -d '\n' < /tmp/prs.err | head -c 400)"
            exit 1
          fi

          while read -r row; do
            [ -z "$row" ] && continue
            j=$(printf '%s' "$row" | base64 -d)

            n=$(printf '%s'      "$j" | jq -r '.n')
            draft=$(printf '%s'  "$j" | jq -r '.draft')
            mergeable=$(printf '%s' "$j" | jq -r '.mergeable')
            mstate=$(printf '%s' "$j" | jq -r '.state')
            automerge=$(printf '%s'  "$j" | jq -r '.automerge')
            labels=$(printf '%s' "$j" | jq -r '.labels | join(" ")')
            ref=$(printf '%s'    "$j" | jq -r '.ref')
            sha=$(printf '%s'    "$j" | jq -r '.sha')
            owner=$(printf '%s'  "$j" | jq -r '.owner')

            # A fork's pull request is untrusted and could not merge anyway; leave it for a human.
            if [ "$owner" != "${GH_REPO%%/*}" ]; then
              echo "#${n}: from a fork — leaving it"
              continue
            fi
            # A draft is somebody's deliberate "not yet", including this file's own parking.
            if [ "$draft" = "true" ]; then
              echo "#${n}: draft — leaving it"
              continue
            fi
            case " $labels " in
              *' review:parked '*) echo "#${n}: parked — leaving it"; continue ;;
            esac

            # The head commit's date, one REST call per pull request. Not `updatedAt`, which
            # also moves when a bot comments — and this file comments — so using it would let a
            # pull request reset its own deadlines simply by being nagged about them.
            last=$(gh api "repos/${GH_REPO}/commits/${sha}" --jq '.commit.committer.date' 2>/dev/null || true)
            if [ -z "$last" ]; then
              echo "#${n}: could not read the head commit date — skipping rather than guessing"
              continue
            fi

            pushed=$(date -u -d "$last" +%s 2>/dev/null || date -u -j -f '%Y-%m-%dT%H:%M:%SZ' "$last" +%s)
            mins=$(( (now - pushed) / 60 ))
            hours=$(( mins / 60 ))
            days=$(( hours / 24 ))

            # ---- 4. abandoned -------------------------------------------------------------
            if [ "$days" -ge "$ABANDON_DAYS" ]; then
              echo "#${n}: no commit for ${days} days — closing"
              gh pr comment "$n" --repo "$GH_REPO" --body \
                "Closing: no commit on \`${ref}\` for ${days} days. The branch is left in place, so reopening loses nothing. If this work still matters, it needs an issue describing what remains — a pull request nobody has touched in a week is not a plan." || true
              gh pr close "$n" --repo "$GH_REPO" || true
              acted=$((acted + 1))
              continue
            fi

            # ---- 3. conflicted ------------------------------------------------------------
            if [ "$mergeable" = "CONFLICTING" ] && [ "$hours" -ge "$CONFLICT_HOURS" ]; then
              echo "#${n}: conflicting for ${hours}h — drafting"
              gh pr edit "$n" --repo "$GH_REPO" --add-label 'stale:conflicting' || true
              drafted=$(draft_pr "$n")
              if [ "$drafted" = "yes" ]; then
                opener="Converted to draft, and labelled \`stale:conflicting\`:"
              else
                opener="Labelled \`stale:conflicting\` (could not convert it to draft — see the run log):"
              fi
              gh pr comment "$n" --repo "$GH_REPO" --body \
                "${opener} \`${ref}\` has conflicted with main for ${hours} hours. No agent in this repository rebases, so this cannot merge however green the review is — and while it conflicts GitHub will not run \`test\` or \`review\` on it at all, because it cannot compute a merge commit, so it cannot even be assessed. Whoever picks it up: rebase on main, push, and mark it ready." || true
              acted=$((acted + 1))
              continue
            fi

            # ---- 2. refused, and nothing came back ----------------------------------------
            # `review:changes-requested` is set by `review` whenever a verdict refuses the
            # pull request, whether or not the findings could be delivered to an agent. While
            # it is there, rule 1 must not release the pull request: that label is the
            # refusal itself, and only a later clean verdict removes it.
            case " $labels " in
              *' review:changes-requested '*)
                if [ "$hours" -ge "$GHOSTED_HOURS" ]; then
                  echo "#${n}: refused, no push for ${hours}h — parking"
                  gh pr edit "$n" --repo "$GH_REPO" --add-label 'review:parked' || true
                  drafted=$(draft_pr "$n")
                  [ "$drafted" = "yes" ] && how="Parked as a draft" || how="Parked (labelled \`review:parked\`; could not convert it to draft — see the run log)"
                  gh pr comment "$n" --repo "$GH_REPO" --body \
                    "${how}: the review asked for changes ${hours} hours ago and no push to \`${ref}\` followed. Either the findings never reached an agent, or the session that wrote this had already finished and could not be resumed, or it decided the findings were wrong without saying so. The findings are in the comments above; nothing here merges until a review comes back \`VERDICT: CLEAN\`." || true
                  gh issue create --repo "$GH_REPO" \
                    --title "Review on #${n} was refused and never answered" \
                    --label 'blocked' \
                    --body "$(printf 'Pull request #%s was refused by the reviewer and received no push within %s hours. It is now parked and labelled `review:parked`.\n\nCheck which of these it is, because they need different fixes:\n\n- The relay comment says it delivered the findings, and Jules did nothing. The session had most likely already completed, so `sendMessage` was accepted but idle. The fallback that starts a session on the branch is the thing to look at.\n- The relay comment says there was no session id in the body. This came from a lane that is not Jules, so there is no author to send findings to and it will always land here.\n- There is no relay comment at all. `review` reached a verdict and then failed; see its run log.\n' "$n" "$GHOSTED_HOURS")" || true
                  acted=$((acted + 1))
                else
                  echo "#${n}: refused ${hours}h ago — waiting for a push"
                fi
                continue
                ;;
            esac

            # ---- 1a. a red build nobody told the author about ------------------------------
            #
            # The relay in `review` only fires on CHANGES_REQUIRED, so until now a failing
            # `test` reached no one. #49 is the case: reviewed, came back VERDICT: CLEAN, and
            # `test` red because the suite ran 664 while the documents said 662. Correct on
            # every side, and completely stuck — the session that wrote it had no idea, and the
            # pull request would have sat until the seven-day abandon sweep closed it.
            #
            # A red build is more actionable than a review finding: it is a fact, not an
            # opinion, and the failing output says exactly what to change.
            test_conclusion=$(gh api "repos/${GH_REPO}/commits/${sha}/check-runs" \
              --jq '[.check_runs[] | select(.name == "test")] | last | .conclusion // empty' 2>/dev/null || true)

            if [ "$test_conclusion" = "failure" ]; then
              comments=$(gh pr view "$n" --repo "$GH_REPO" --json comments \
                --jq '[.comments[].body] | join(" ")' 2>/dev/null || true)

              run_id=$(gh api "repos/${GH_REPO}/commits/${sha}/check-runs" \
                --jq '[.check_runs[] | select(.name == "test")] | last | .details_url' 2>/dev/null \
                | grep -oE '/runs/[0-9]+' | grep -oE '[0-9]+' || true)

              # ---- retry once before believing it ----------------------------------------
              #
              # `test` is a required check and the suite has a known flake (#46): the relay
              # drops frames for a peer that is not in the mailbox, so a sync test fails
              # roughly one run in eight under load. It reached CI three times on 2026-08-17
              # alone. At six to twelve pull requests a day that is one or two a day going red
              # for a reason no agent can reproduce, each needing a human to press a button.
              # Nothing here presses buttons, so every one of them would sit until the
              # seven-day abandon sweep.
              #
              # So: re-run once, and only believe the second answer. A real failure fails
              # twice and reaches the author a sweep later; a one-in-eight flake becomes
              # one-in-sixty-four, which survives a fortnight unattended.
              #
              # This is mitigation, not a fix, and it is deliberately bounded at one attempt:
              # a retry loop would hide a genuinely broken build forever. The marker comment
              # makes each retry visible, so a pattern of them is evidence rather than noise.
              # #46 stays open, and the real fix is catch-up on reconnect in runtime/sync/.
              if [ -n "$run_id" ] && ! printf '%s' "$comments" | grep -q "test-retry:${sha}"; then
                echo "#${n}: \`test\` failed on ${sha} — re-running once before believing it"
                if gh run rerun "$run_id" --repo "$GH_REPO" --failed >/dev/null 2>&1; then
                  gh pr comment "$n" --repo "$GH_REPO" --body \
                    "\`test\` failed on \`${sha}\` and has been re-run once. This repository has a known flake in the sync tests (#46) that fails about one run in eight, so a single red build is not yet evidence of anything. If the re-run fails too, the findings go to whoever wrote this and the pull request stops here.

          <!-- test-retry:${sha} -->" || true
                  acted=$((acted + 1))
                  continue
                fi
                echo "::warning::Could not re-run the failed build for #${n}; treating this failure as real."
              fi

              # ---- it failed twice, or could not be re-run: tell the author ---------------
              if printf '%s' "$comments" | grep -q "build-relay:${sha}"; then
                echo "#${n}: build failing and already relayed for ${sha}"
                continue
              fi

              echo "#${n}: \`test\` failed again on ${sha} — relaying to the author"
              log=""
              [ -n "$run_id" ] && log=$(gh run view "$run_id" --repo "$GH_REPO" --log-failed 2>/dev/null | tail -c 3000 || true)

              session=$(gh pr view "$n" --repo "$GH_REPO" --json body --jq '.body' 2>/dev/null \
                | grep -oE '(jules\.google\.com/(task|session)/|sessions/)[0-9]+' \
                | grep -oE '[0-9]+' | head -1 || true)

              {
                printf 'The pull request you opened (#%s, branch `%s`) has a failing build. It cannot merge until `test` is green, and no review verdict changes that.\n\n' "$n" "$ref"
                printf 'Fix it on the SAME branch and push there; do not open a new pull request. Run `npm test` locally before pushing.\n\n'
                printf 'A common cause in this repository: adding or removing a test changes the suite total, and `ci.yml` fails if the number in the documents disagrees with the number the suite actually ran. The failure output names every file to update.\n\n'
                printf -- '--- end of the failing run ---\n\n```\n%s\n```\n' "${log:-（no log could be retrieved — see the run in the Actions tab）}"
              } > /tmp/build-msg.md

              delivered=""
              if [ -n "$session" ] && [ -n "${JULES_API_KEY:-}" ]; then
                jq -Rs '{prompt: .}' < /tmp/build-msg.md > /tmp/build-send.json
                code=$(curl -sS -o /tmp/build-out.json -w '%{http_code}' --max-time 60 \
                  -X POST "https://jules.googleapis.com/v1alpha/sessions/${session}:sendMessage" \
                  -H "x-goog-api-key: ${JULES_API_KEY}" -H 'Content-Type: application/json' \
                  -d @/tmp/build-send.json || printf '000')
                echo "sendMessage → HTTP ${code}"
                { [ "$code" = "200" ] || [ "$code" = "204" ]; } && delivered="the authoring Jules session"
              fi

              if [ -n "$delivered" ]; then
                note="Relayed to ${delivered}."
              elif [ -z "$session" ]; then
                note="This pull request carries no Jules session id, so there is no author to notify — whoever owns this branch needs to look."
              else
                note="The authoring session could not be reached, so nobody has been told automatically."
              fi
              gh pr comment "$n" --repo "$GH_REPO" --body \
                "\`test\` is failing on \`${sha}\`, so this cannot merge whatever the review says. ${note}

          <!-- build-relay:${sha} -->" || true
              acted=$((acted + 1))
              continue
            fi

            # ---- 1b. up to date with main -------------------------------------------------
            #
            # Branch protection here is `strict`: a pull request must be up to date with main
            # before it can merge. So every time one lands, every other open pull request goes
            # BEHIND — and nothing in this repository updated branches, so the queue deadlocked
            # after the first merge. #49 sat with a clean review, a green suite and auto-merge
            # enabled, going nowhere, purely because main had moved underneath it.
            #
            # One per sweep. Updating a branch is a new commit, which re-runs `test` and the
            # review, so doing all of them at once would spend the day's provider quota on
            # merge commits. The next sweep is twenty minutes away and takes the next one.
            if [ "$mstate" = "BEHIND" ]; then
              echo "#${n}: behind main — updating the branch so it can merge"
              if gh api -X PUT "repos/${GH_REPO}/pulls/${n}/update-branch" >/dev/null 2>&1; then
                acted=$((acted + 1))
              else
                echo "::warning::#${n} is behind main and could not be updated; it cannot merge until it is."
              fi
              continue
            fi

            # ---- 1. no verdict: release on `test` alone ------------------------------------
            if [ "$automerge" = "true" ]; then
              echo "#${n}: already queued for merge"
              continue
            fi
            if [ "$mins" -ge "$GRACE_MINUTES" ]; then
              echo "#${n}: ${mins} minutes with no verdict — releasing on \`test\`"
              # Label it BEFORE merging, so what merged unreviewed is answerable later with a
              # search rather than by reading every pull request. The comment alone was not
              # enough: this valve is the one place the project's quality bar drops to "the
              # tests passed", and over a fortnight of provider rate limits that could be a
              # dozen changes. Nobody can audit a decision they cannot enumerate, and the
              # daily state report lists these first for exactly that reason.
              gh pr edit "$n" --repo "$GH_REPO" --add-label 'merged:unreviewed' || true
              # No `|| true` on the merge itself. This is the release valve, and a valve that fails quietly is the
              # same as no valve — which is exactly what happened while this file ran with
              # `contents: read`: the merge was refused, the failure was swallowed, and the run
              # still counted the pull request as acted on and exited green.
              # Retry, and tell a bad minute from a real refusal. GitHub returned 503 on this
              # exact call twice in a row on 2026-08-17 while its status page said all systems
              # operational. Going red for that would mean a red badge every twenty minutes for
              # as long as GitHub is unwell — "red for a reason nobody can act on", which this
              # repository has decided is worse than no signal. The next sweep retries anyway,
              # so a transient failure costs twenty minutes and nothing else.
              merged=0
              for attempt in 1 2 3; do
                if gh pr merge "$n" --repo "$GH_REPO" --auto --squash --delete-branch 2>/tmp/merge.err; then
                  merged=1; break
                fi
                echo "queue attempt ${attempt} for #${n}: $(tr -d '\n' < /tmp/merge.err | head -c 160)"
                [ "$attempt" -lt 3 ] && sleep 10
              done
              if [ "$merged" = "0" ] && grep -qE '\b(500|502|503|504)\b|No server is currently available' /tmp/merge.err; then
                echo "::warning::#${n} could not be queued for merge — GitHub returned a transient error three times. The next sweep in 20 minutes tries again; nothing is lost."
                continue
              fi
              if [ "$merged" = "1" ]; then
                gh pr comment "$n" --repo "$GH_REPO" --body \
                  "Queued for merge without a review. No verdict arrived within ${GRACE_MINUTES} minutes, so \`test\` is the only gate on this one. That is deliberate: a reviewer that is down must not be able to stop the project while nobody is watching. Check the \`review\` workflow if this keeps happening." || true
                acted=$((acted + 1))
              else
                echo "::error::#${n} is past its grace period and could not be queued for merge. The release valve is not working, so nothing will merge without a clean review."
                gh pr comment "$n" --repo "$GH_REPO" --body \
                  "No verdict arrived within ${GRACE_MINUTES} minutes, so this should have been released on \`test\` alone — and queueing the merge failed. See [the run log](${GITHUB_SERVER_URL}/${GH_REPO}/actions/runs/${GITHUB_RUN_ID}). Until that is fixed nothing merges here without a clean review, which is the deadlock this workflow exists to prevent, so it needs a human." || true
                failed=$((failed + 1))
              fi
            else
              echo "#${n}: ${mins} minutes old, waiting for a verdict"
            fi
          done < /tmp/prs.txt

          echo "swept: ${acted} pull request(s) acted on, ${failed} action(s) failed"
          if [ "$failed" -gt 0 ]; then
            # Red on purpose. Everything above is a deadline nobody is watching, so a sweeper
            # that could not do its job must not report success — that is how it ran for an
            # afternoon announcing "swept: 2" while merging nothing at all.
            echo "::error::${failed} pull request(s) could not be acted on. Deadlines in this file are not being enforced."
            exit 1
          fi
