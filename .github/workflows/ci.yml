name: test

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      # Node 22 is the floor declared in package.json engines. If it passes here it
      # passes above; there is nothing to install, because there is nothing to install.
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Zero dependencies
        run: |
          node -e '
            const pkg = require("./package.json");
            for (const field of ["dependencies", "devDependencies", "peerDependencies",
                                 "optionalDependencies", "bundledDependencies"]) {
              const v = pkg[field];
              if (v && Object.keys(v).length > 0) {
                console.error(`package.json declares ${field}: ` + Object.keys(v).join(", "));
                console.error("Zero runtime dependencies is a structural commitment (Principle 3),");
                console.error("not a preference. See docs/CONTRACT.md, non-negotiable 1.");
                process.exit(1);
              }
            }
            console.log("no dependencies declared — as intended");
          '
          if [ -f package-lock.json ] || [ -d node_modules ]; then
            echo "package-lock.json or node_modules present in the repository"
            exit 1
          fi

      - name: No key material
        run: |
          if git ls-files | grep -Ei '\.(jwk|pem|key)$|release-key|^\.env'; then
            echo "key material is tracked in a public repository"
            exit 1
          fi
          echo "no key material tracked"

      - name: No workspace in the checkout
        run: |
          # A workspace written into the source tree hijacks this repository's own history.
          # It has happened twice. test/checkout-hygiene.test.js covers this too; this step
          # makes the failure legible before the suite even starts.
          for artefact in documents peers neodonkey.json; do
            if git ls-files --error-unmatch "$artefact" >/dev/null 2>&1; then
              echo "workspace artefact tracked: $artefact"
              exit 1
            fi
          done
          echo "checkout is not a workspace"

      - name: Tests
        # Not `npm test`: the default runner concurrency is the core count, and several tests
        # spawn real processes — a relay and two peers that must complete a handshake. On a
        # two-core runner, thirty-two test files competing for those cores starve them and the
        # sync tests fail on timing rather than on behaviour. Two at a time is slower and honest.
        # Locally, `npm test` still uses the full machine.
        #
        # `tee` keeps the summary for the next step. `pipefail` is what makes the pipe still
        # fail the build when a test fails — without it the exit status would be `tee`'s.
        id: suite
        shell: bash
        run: |
          # Not `set -o pipefail` + fail here. The next step decides, because a failure whose
          # only casualty is a known flake must not stop the queue — see test/known-flaky.txt.
          set +e +o pipefail
          node --test --test-concurrency=2 "test/*.test.js" 2>&1 | tee "${RUNNER_TEMP}/suite.txt"
          echo "rc=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"

      # The demo is the product, and until now nothing ran it.
      #
      # demo/sarah.mjs calls itself "the acceptance test for the whole MVP" and it earns that:
      # it builds a company from nothing, then hands the folder to real `git` and real
      # `ssh-keygen` and asks them what they think — `git fsck --strict`, signature verification
      # on every commit, a checkout of the first commit yielding a readable company. It is also
      # the single artefact you would put in front of anyone: the thing that shows an ERP with
      # no server, no vendor and no dependencies actually working.
      #
      # It was run by no workflow, no test, and no npm script. It works today. Nothing would
      # have said which commit broke it, and a demo discovered broken is a launch discovered
      # broken. One second of runner time to keep it that way.
      - name: The MVP acceptance demo still runs
        run: node demo/sarah.mjs

      # A red build for a reason no agent can reproduce is the single most effective way to
      # stop this repository, because `test` is required and nothing here presses re-run. #29
      # was blocked by exactly that on 2026-08-17: correct work, green review, failed on the
      # #46 relay flake.
      #
      # So: if every failing test is named in test/known-flaky.txt, warn and continue. If
      # anything else failed — including a known-flaky test failing *alongside* something real
      # — fail. The quarantine can only ever forgive the listed names, never a whole run.
      - name: Decide whether the failures were only the known flakes
        if: always() && steps.suite.outputs.rc != '0'
        shell: bash
        run: |
          set -uo pipefail
          failing=$(grep -E '^not ok [0-9]+ - ' "${RUNNER_TEMP}/suite.txt" \
                    | sed -E 's/^not ok [0-9]+ - //' | sed -E 's/[[:space:]]*#.*$//' || true)

          if [ -z "$failing" ]; then
            echo "::error::The suite exited ${{ steps.suite.outputs.rc }} but no test reported 'not ok'."
            echo "That is a crash, a timeout or a runner failure, not a test failure — read the log above."
            exit 1
          fi

          allow=$(grep -vE '^[[:space:]]*#|^[[:space:]]*$' test/known-flaky.txt || true)
          unexpected=""
          while IFS= read -r t; do
            [ -z "$t" ] && continue
            ok=0
            while IFS= read -r pat; do
              [ -z "$pat" ] && continue
              case "$t" in *"$pat"*) ok=1; break ;; esac
            done <<< "$allow"
            [ "$ok" = "0" ] && unexpected="${unexpected}  ${t}"$'\n'
          done <<< "$failing"

          if [ -n "$unexpected" ]; then
            echo "::error::The suite failed, and not only on known flakes."
            printf 'Failures not covered by test/known-flaky.txt:\n%s\n' "$unexpected"
            exit 1
          fi

          echo "::warning::The suite failed, but every failing test is a known flake (test/known-flaky.txt):"
          printf '%s\n' "$failing"
          echo "Continuing. This is a recorded compromise — see docs/COMPROMISES.md and #46."

      - name: The suite size meets or exceeds the floor in test/suite-floor.txt
        # Compares the run against the floor in test/suite-floor.txt (Issue #55).
        # Adding tests no longer requires changing documentation, preventing PR conflicts.
        # Removing tests below the floor fails loudly.
        shell: bash
        run: |
          set -euo pipefail

          # Matched without the reporter's `ℹ` glyph, which is not worth depending on.
          ran=$(grep -oE '[[:space:]]tests[[:space:]]+[0-9]+$' "${RUNNER_TEMP}/suite.txt" \
                | tail -1 | grep -oE '[0-9]+$' || true)
          if [ -z "$ran" ]; then
            echo "Could not find the test total in the runner's summary. The reporter's output"
            echo "format has changed, so this guard is no longer checking anything — fix it"
            echo "rather than deleting it."
            exit 1
          fi

          floor_file="test/suite-floor.txt"
          if [ ! -f "$floor_file" ]; then
            echo "Floor file $floor_file missing!"
            exit 1
          fi
          floor=$(tr -d '[:space:]' < "$floor_file")

          if [ "$ran" -lt "$floor" ]; then
            echo "The suite ran ${ran} tests, which is below the floor of ${floor} set in ${floor_file}."
            echo "If tests were intentionally removed, update ${floor_file}."
            exit 1
          fi
          echo "suite ran ${ran} tests, meeting or exceeding floor (${floor} from ${floor_file})"
