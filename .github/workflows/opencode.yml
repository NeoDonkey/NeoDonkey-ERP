name: opencode

# Manual trigger: comment /oc or /opencode on an issue or pull request.
#
# The guard below is the point of this file. This repository is public, so anybody can
# comment on any issue, and a comment is untrusted input. Without an author check, any
# stranger could start a run that spends OPENCODE_API_KEY. Only the repository owner may
# trigger it.

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

permissions:
  id-token: write
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: opencode-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  opencode:
    if: |
      github.event.comment.user.login == 'danielfrommunich' &&
      (
        contains(github.event.comment.body, ' /oc') ||
        startsWith(github.event.comment.body, '/oc') ||
        contains(github.event.comment.body, ' /opencode') ||
        startsWith(github.event.comment.body, '/opencode')
      )
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Run opencode
        uses: anomalyco/opencode/github@latest
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          # Without a token the action cannot build its API client and dies with
          # "Failed to parse JSON" before it does anything. The OIDC route the action
          # takes by default does not work here.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          model: opencode/big-pickle
          use_github_token: true
          # Defaults to true on public repositories, which would publish the session.
          share: false
